# Реестр адресатов канала send-telegram — ФОРМА с плейсхолдерами.
#
# Рабочий recipients.yaml лежит ВНЕ git: связка «имя человека ↔ его чат» —
# персональные данные. Здесь только форма; значения chat_id не хранятся нигде
# в реестре вообще — он несёт ИМЕНА ключей окружения (chat_id_ref), а сами
# номера живут в .env рядом с TELEGRAM_BOT_TOKEN.
#
# Проверка:  python3 scripts/recipients.py --validate --registry <файл>
# Список:    python3 scripts/recipients.py --list --registry <файл>
#
# Порядок поиска рабочего файла (как у кредов в скриптах канала):
#   SVAIB_RECIPIENTS → ./recipients.yaml → git-root/recipients.yaml
#   → ~/.config/svaib/recipients.yaml

version: 1

# Реестр действителен ровно для ОДНОГО бота. chat_id — свойство пары
# (бот, получатель): один и тот же человек у другого бота имеет другой номер.
# Пока у каждого в команде свой бот, реестр от чужого бота молча резолвил бы
# алиасы в чужие номера — поэтому id сверяется перед отправкой.
# id — это префикс токена до двоеточия, публичная величина: сверка офлайн,
# без обращения к API и без чтения секрета целиком.
bot:
  id: "1234567890"
  username: example_bot

people:
  - alias: person-a
    # Путь от корня базы. Канон scaffold — плоский файл {unit}/02_team/{slug}.md.
    person_ref: 01_company/02_team/person-a.md
    chat_id_ref: TG_CHAT_PERSON_A

groups:
  - alias: team
    chat_id_ref: TG_CHAT_TEAM
    purpose: общий чат команды
    # Справочное поле: доставка уходит ВСЕМ участникам чата, а не этому списку.
    # Реальный состав группы может быть шире — реестр его не контролирует.
    members: [person-a]
